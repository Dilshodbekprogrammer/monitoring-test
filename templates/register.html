{% extends "base.html" %}
{% block title %}Ro'yxatdan o'tish{% endblock %}
{% block nav %}{% endblock %}
{% block body %}
<div class="login card" style="max-width:460px;margin:5vh auto">
  <h1>O'qituvchi sifatida ro'yxatdan o'tish</h1>
  <p class="sub">{{ trial }} kun bepul. Karta talab qilinmaydi.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>F.I.Sh.</label>
    <input type="text" name="full_name" value="{{ form.get('full_name', '') }}" required autofocus>
    <label>Telefon raqami</label>
    <input type="text" name="phone" value="{{ form.get('phone', '') }}" placeholder="90 123 45 67" required>
    <label>Fan(lar)ingiz <span class="muted">(vergul bilan)</span></label>
    <input type="text" name="subjects" value="{{ form.get('subjects', '') }}" placeholder="Matematika, Fizika" required>
    <div class="row">
      <div><label>Login</label><input type="text" name="username" value="{{ form.get('username', '') }}" autocomplete="username" required></div>
      <div><label>Parol (kamida 8 belgi)</label><input type="password" name="password" autocomplete="new-password" required></div>
    </div>
    <p><button class="btn" style="width:100%">Ro'yxatdan o'tish</button></p>
    <p class="small muted" style="text-align:center">Akkauntingiz bormi? <a href="{{ url_for('login') }}">Kirish</a></p>
  </form>
</div>
{% endblock %}
